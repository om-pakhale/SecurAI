services:
  sniffer-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securai-daemon
    command: python core/writter_daemon.py
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - ./sentinel.db:/app/sentinel.db
      - ./core:/app/core
      - ./Models:/app/Models

  dashboard-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securai-ui
    command: streamlit run main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    restart: unless-stopped
    volumes:
      - ./sentinel.db:/app/sentinel.db
      - ./main.py:/app/main.py
      - ./Models:/app/Models
      - ./core:/app/core
    depends_on:
      - sniffer-daemon